<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desain Aplikasi Catatan Pengeluaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#12161C; --muted:#6B7480; --line:#E3E6EB;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --warn:#C2410C; --soft:#F3F5F7;
  --c1:#1F6F5C; --c2:#3B6FD4; --c3:#B7791F; --c4:#8B5CF6; --c5:#9AA3AF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E12; --surface:#151A21; --ink:#EEF1F4; --muted:#939CA8; --line:#242B34;
    --accent:#5BC3A6; --accent-ink:#0B0E12; --warn:#FB923C; --soft:#1C222B;
    --c1:#5BC3A6; --c2:#7AA2F0; --c3:#E0A94A; --c4:#A78BFA; --c5:#6B7480; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E12; --surface:#151A21; --ink:#EEF1F4; --muted:#939CA8; --line:#242B34;
  --accent:#5BC3A6; --accent-ink:#0B0E12; --warn:#FB923C; --soft:#1C222B;
  --c1:#5BC3A6; --c2:#7AA2F0; --c3:#E0A94A; --c4:#A78BFA; --c5:#6B7480; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:24px 16px 48px}
.top{max-width:1240px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.top p{color:var(--muted);font-size:14px;margin-top:2px}
.toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.toggle:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{max-width:1240px;margin:0 auto;overflow-x:auto;padding-bottom:8px}
.row{display:grid;grid-template-columns:repeat(4,300px);gap:24px;justify-content:center;min-width:1272px}
figure{display:flex;flex-direction:column;gap:10px}
figcaption{font-size:13px;color:var(--muted);text-align:center}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:36px;min-height:690px;flex:1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.scr{padding:22px 18px 8px;display:flex;flex-direction:column;gap:16px;flex:1}
.bar{display:flex;justify-content:space-between;align-items:center}
.month{font-weight:600;font-size:15px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.hero small{color:var(--muted);font-size:13px}
.hero b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.hero span{font-size:13px;color:var(--accent);font-weight:600}
.days{display:flex;align-items:flex-end;gap:3px;height:56px}
.days i{flex:1;background:var(--line);border-radius:2px}
.days i.hi{background:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo div{background:var(--soft);border-radius:14px;padding:12px}
.duo small{display:block;color:var(--muted);font-size:12px}
.duo b{font-size:15px;font-variant-numeric:tabular-nums}
h2{font-size:14px;font-weight:600}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.cat .t{grid-column:1/-1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.cat .t i{display:block;height:100%;border-radius:3px}
.list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.tx:first-child{border-top:0}
.dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.tx small{display:block;color:var(--muted);font-size:12px}
.tx em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.in{color:var(--accent)}
.nav{margin-top:auto;display:flex;justify-content:space-around;align-items:center;padding:10px 12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.nav span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 8px}
.nav .on{color:var(--ink);font-weight:600}
.nav .add{width:46px;height:46px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:24px;font-weight:600;display:grid;place-items:center;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;font-size:14px;font-weight:600;text-align:center}
.seg span{padding:8px;border-radius:10px;color:var(--muted)}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.amt{text-align:center;padding:8px 0}
.amt small{color:var(--muted);font-size:13px}
.amt b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.field small{color:var(--muted)}
.btn{margin-top:auto;border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:15px;font:inherit;font-weight:600;font-size:15px;width:100%}
.bud{display:flex;flex-direction:column;gap:6px;font-size:14px}
.bud .h{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bud .t{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bud .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bud.over .t i{background:var(--warn)}
.bud small{color:var(--muted);font-size:12px}
.bud.over small{color:var(--warn);font-weight:600}
.alert{background:var(--soft);border-radius:14px;padding:12px;font-size:13px;line-height:1.45}
.chat{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.4}
.b{max-width:82%;padding:9px 12px;border-radius:16px}
.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.b small{display:block;margin-top:4px;opacity:.7;font-size:12px}
.wahead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.wahead .dot{background:var(--accent);color:var(--accent-ink)}
.wahead small{display:block;color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:auto}
@media (prefers-reduced-motion:no-preference){.days i{transform-origin:bottom;animation:g .6s ease-out both}}
@keyframes g{from{transform:scaleY(.1)}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Catatan Pengeluaran, rancangan layar utama</h1>
    <p>Flutter + Supabase. Empat layar MVP: beranda, tambah transaksi, anggaran, bot WhatsApp.</p>
  </div>
  <button class="toggle" id="theme" type="button">Ganti ke mode gelap</button>
</header>

<main class="stage"><div class="row">

<figure>
<div class="phone"><div class="scr">
  <div class="bar"><span class="month">November 2026</span><span class="sync"><i></i>Tersinkron</span></div>
  <div class="hero"><small>Pengeluaran bulan ini</small><b>Rp 3.482.000</b><span>12% lebih rendah dari Oktober</span></div>
  <div class="days" id="days" aria-label="Pengeluaran per hari"></div>
  <div class="duo">
    <div><small>Pemasukan</small><b>Rp 6.000.000</b></div>
    <div><small>Sisa</small><b>Rp 2.518.000</b></div>
  </div>
  <h2>Per kategori</h2>
  <div class="cat"><span>Makan</span><b>1.240.000</b><div class="t"><i style="width:100%;background:var(--c1)"></i></div></div>
  <div class="cat"><span>Belanja</span><b>780.000</b><div class="t"><i style="width:63%;background:var(--c2)"></i></div></div>
  <div class="cat"><span>Transport</span><b>620.000</b><div class="t"><i style="width:50%;background:var(--c3)"></i></div></div>
  <div class="cat"><span>Tagihan</span><b>560.000</b><div class="t"><i style="width:45%;background:var(--c4)"></i></div></div>
</div>
<div class="nav"><span class="on">Beranda</span><span>Riwayat</span><span class="add">+</span><span>Anggaran</span><span>Profil</span></div></div>
<figcaption>Beranda: ringkasan bulanan</figcaption>
</figure>

<figure>
<div class="phone"><div class="scr">
  <div class="bar"><span class="month">Tambah transaksi</span><span class="sync">Tutup</span></div>
  <div class="seg"><span class="on">Pengeluaran</span><span>Pemasukan</span></div>
  <div class="amt"><small>Jumlah</small><b>Rp 25.000</b></div>
  <div class="chips"><span class="chip on">Makan</span><span class="chip">Transport</span><span class="chip">Belanja</span><span class="chip">Tagihan</span><span class="chip">Lainnya</span></div>
  <div class="field"><span>Catatan</span><small>Makan siang</small></div>
  <div class="field"><span>Tanggal</span><small>Hari ini, 22 Nov</small></div>
  <div class="field"><span>Foto struk</span><small>Tambah foto</small></div>
  <button class="btn" type="button">Simpan transaksi</button>
  <div class="note">Tersimpan di perangkat dulu, lalu sinkron saat online.</div>
</div></div>
<figcaption>Input cepat, bisa tanpa internet</figcaption>
</figure>

<figure>
<div class="phone"><div class="scr">
  <div class="bar"><span class="month">Anggaran</span><span class="sync">November</span></div>
  <div class="alert">Transport sudah lewat anggaran Rp 20.000. Makan tersisa Rp 260.000 untuk 8 hari.</div>
  <div class="bud"><div class="h"><span>Makan</span><b>1.240.000 / 1.500.000</b></div><div class="t"><i style="width:83%"></i></div><small>Sisa Rp 260.000</small></div>
  <div class="bud over"><div class="h"><span>Transport</span><b>620.000 / 600.000</b></div><div class="t"><i style="width:100%"></i></div><small>Lewat Rp 20.000</small></div>
  <div class="bud"><div class="h"><span>Belanja</span><b>780.000 / 1.000.000</b></div><div class="t"><i style="width:78%"></i></div><small>Sisa Rp 220.000</small></div>
  <div class="bud"><div class="h"><span>Tagihan</span><b>560.000 / 600.000</b></div><div class="t"><i style="width:93%"></i></div><small>Sisa Rp 40.000</small></div>
  <h2>Transaksi terbaru</h2>
  <div class="list">
    <div class="tx"><div class="dot" style="background:var(--c1)">Mk</div><div>Makan siang<small>Hari ini, via WhatsApp</small></div><em>−25.000</em></div>
    <div class="tx"><div class="dot" style="background:var(--c3)">Tr</div><div>Ojek ke kampus<small>Kemarin</small></div><em>−18.000</em></div>
  </div>
</div>
<div class="nav"><span>Beranda</span><span>Riwayat</span><span class="add">+</span><span class="on">Anggaran</span><span>Profil</span></div></div>
<figcaption>Anggaran per kategori dengan peringatan</figcaption>
</figure>

<figure>
<div class="phone"><div class="scr">
  <div class="wahead"><div class="dot">C</div><div><b>Bot Catatan</b><small>Opsional, terhubung ke akunmu</small></div></div>
  <div class="chat">
    <div class="b me">makan siang 25rb</div>
    <div class="b bot">Tercatat: Makan, Rp 25.000, hari ini.<small>Balas “batal” untuk menghapus</small></div>
    <div class="b me">gaji 6jt masuk</div>
    <div class="b bot">Tercatat pemasukan Rp 6.000.000.</div>
    <div class="b me">ojek 18k</div>
    <div class="b bot">Kategori belum jelas. Balas 1 Transport, 2 Belanja, 3 Lainnya.</div>
    <div class="b me">1</div>
    <div class="b bot">Tercatat: Transport, Rp 18.000.</div>
    <div class="b me">rekap</div>
    <div class="b bot">November: keluar Rp 3.482.000, masuk Rp 6.000.000. Terbesar: Makan Rp 1.240.000.</div>
  </div>
</div></div>
<figcaption>Catat lewat WhatsApp (opsional)</figcaption>
</figure>

</div></main>

<script>
(function(){
  var v=[40,12,55,30,8,62,35,20,48,10,70,28,15,44,52,9,38,66,24,18,58,34];
  var el=document.getElementById('days');
  v.forEach(function(n,i){var b=document.createElement('i');b.style.height=n+'%';if(i===v.length-1)b.className='hi';el.appendChild(b);});
  var btn=document.getElementById('theme'),root=document.documentElement;
  function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
  function label(){btn.textContent=isDark()?'Ganti ke mode terang':'Ganti ke mode gelap';}
  btn.addEventListener('click',function(){root.setAttribute('data-theme',isDark()?'light':'dark');label();});
  label();
})();
</script>
</body>
</html>
